agents:
  default:
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.7
    api_base: "https://api.openai.com/v1"

  ceo_agent:
    provider: "anthropic" # CEO 使用 Claude 3.5 Sonnet 以获得更好的战略规划能力
    model: "claude-3-5-sonnet-20240620"
    temperature: 0.5
    system_prompt: "你是 Autonomy 的 CEO。你负责宏观战略和资源分配。"

  cpo_agent:
    provider: "openai"
    model: "gpt-4o" # CPO 使用 GPT-4o
    temperature: 0.8
    system_prompt: "你也是 Autonomy 的首席选品官 (CPO)。你对市场趋势有敏锐的嗅觉。"

  scm_agent:
    provider: "openai"
    model: "gpt-4o-mini" # SCM 使用高性价比模型
    temperature: 0.2
    api_base: "https://api.openai.com/v1"
    system_prompt: "你是 Autonomy 的供应链管理 (SCM) 专家。你关注成本、效率和库存安全。"